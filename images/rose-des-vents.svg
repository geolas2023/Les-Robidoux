<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -110 220 220" width="440" height="440">
<title>Rose des vents</title>
<g stroke="#1f2f3a" stroke-linejoin="round">
  <circle r="96" fill="none" stroke-width="1.6"/>
  <circle r="90" fill="none" stroke-width=".6"/>
  <circle r="62" fill="none" stroke-width=".8" stroke-dasharray="2 3"/>
  <!-- graduations -->
  <g stroke-width=".7">
    <path d="M0 -96 V-90" transform="rotate(0)"/>
  </g>
  <g id="g" stroke-width=".6">
    <path d="M0 -96 V-91"/><path d="M0 -96 V-91" transform="rotate(11.25)"/><path d="M0 -96 V-91" transform="rotate(22.5)"/><path d="M0 -96 V-91" transform="rotate(33.75)"/>
    <path d="M0 -96 V-91" transform="rotate(45)"/><path d="M0 -96 V-91" transform="rotate(56.25)"/><path d="M0 -96 V-91" transform="rotate(67.5)"/><path d="M0 -96 V-91" transform="rotate(78.75)"/>
  </g>
  <use href="#g" transform="rotate(90)"/><use href="#g" transform="rotate(180)"/><use href="#g" transform="rotate(270)"/>
  <!-- pointes secondaires (32 vents) -->
  <g fill="#d6e3df" stroke-width=".7">
    <path id="p3" d="M0 -66 L4 -8 L0 0 L-4 -8Z" transform="rotate(22.5)"/>
    <use href="#p3" transform="rotate(45)"/><use href="#p3" transform="rotate(90)"/><use href="#p3" transform="rotate(135)"/>
    <use href="#p3" transform="rotate(180)"/><use href="#p3" transform="rotate(225)"/><use href="#p3" transform="rotate(270)"/><use href="#p3" transform="rotate(315)"/>
  </g>
  <!-- pointes intercardinales -->
  <g stroke-width=".9">
    <g id="p2" transform="rotate(45)"><path d="M0 -76 L8 -10 L0 0Z" fill="#9a3322"/><path d="M0 -76 L-8 -10 L0 0Z" fill="#eff0e4"/></g>
    <use href="#p2" transform="rotate(90)"/><use href="#p2" transform="rotate(180)"/><use href="#p2" transform="rotate(270)"/>
  </g>
  <!-- pointes cardinales -->
  <g stroke-width="1">
    <g id="p1"><path d="M0 -100 L12 -12 L0 0Z" fill="#1f2f3a"/><path d="M0 -100 L-12 -12 L0 0Z" fill="#eff0e4"/></g>
    <use href="#p1" transform="rotate(90)"/><use href="#p1" transform="rotate(180)"/><use href="#p1" transform="rotate(270)"/>
  </g>
  <circle r="9" fill="#eff0e4" stroke-width="1.2"/>
  <circle r="3" fill="#9a3322" stroke-width=".8"/>
  <!-- fleur de lys au nord -->
  <g transform="translate(0 -104) scale(.55)" fill="#9a3322" stroke-width="1.2">
    <path d="M0 -14 C6 -8 6 2 0 8 C-6 2 -6 -8 0 -14Z"/>
    <path d="M2 4 C10 -6 20 -2 16 8 C13 3 8 4 3 9Z"/>
    <path d="M-2 4 C-10 -6 -20 -2 -16 8 C-13 3 -8 4 -3 9Z"/>
    <rect x="-9" y="8" width="18" height="3"/>
  </g>
</g>
</svg>
