<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="none" width="1000" height="700">
<title>Bords brûlés du parchemin</title>
<defs>
  <filter id="dechire" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022" numOctaves="4" seed="7" result="bruit"/>
    <feDisplacementMap in="SourceGraphic" in2="bruit" scale="34" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="flou"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="flou2"><feGaussianBlur stdDeviation="3"/></filter>
  <mask id="interieur">
    <rect width="1000" height="700" fill="#fff"/>
    <rect x="20" y="18" width="960" height="664" rx="18" fill="#000" filter="url(#dechire)"/>
  </mask>
</defs>
<!-- roussi : large halo brun sous le bord -->
<g filter="url(#flou)">
  <rect x="26" y="24" width="948" height="652" rx="26" fill="none" stroke="#3e5c6e" stroke-width="34" opacity=".55" filter="url(#dechire)"/>
</g>
<!-- brûlure : bord noirci, déchiqueté -->
<g mask="url(#interieur)">
  <rect width="1000" height="700" fill="#16242e"/>
</g>
<!-- liseré roussi juste à l'intérieur de la brûlure -->
<g filter="url(#flou2)" opacity=".8">
  <rect x="22" y="20" width="956" height="660" rx="18" fill="none" stroke="#22394a" stroke-width="7" filter="url(#dechire)"/>
</g>
<!-- quelques taches de brûlure isolées -->
<g fill="#2d4a5c" opacity=".35" filter="url(#flou)">
  <ellipse cx="120" cy="110" rx="40" ry="26"/><ellipse cx="880" cy="600" rx="50" ry="30"/>
  <ellipse cx="930" cy="140" rx="26" ry="40"/><ellipse cx="70" cy="560" rx="30" ry="44"/>
  <ellipse cx="520" cy="660" rx="60" ry="16"/>
</g>
</svg>
