  <path d="M39 33 C44 26 50 22 55 20" stroke-width="2" fill="none"/>
  <!-- fusil à l'épaule -->
  <path d="M33 70 L74 10" stroke-width="2.6" fill="none"/>
  <path d="M30 72 C29 76 32 78 35 76 L38 70 L34 67 Z"/>
