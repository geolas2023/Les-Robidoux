  <path d="M41 30 C44 26 50 25 55 27 C59 29 61 34 61 40 L62 56 C63 61 63 65 62 68 C56 70 47 70 41 67 C40 61 40 55 40 48 Z"/>
  <!-- franges du capot -->
  <path d="M42 68 L41 71 M45 69 L44 72 M48 69.5 L48 72.5 M51 69.5 L51 72.5 M54 69.5 L55 72.5 M57 69 L58 72 M60 68.5 L61 71.5" stroke-width="1" fill="none"/>
  <!-- ceinture fléchée : nœud et pans -->
  <path d="M40 50 C47 52 55 52 62 49 L62 54 C55 57 47 57 40 55 Z" fill="#c8573a" stroke="#eadbb8" stroke-width=".8"/>
  <path d="M43 52 l3 2 3 -2 3 2 3 -2 3 2 3 -2" stroke="#3b3328" stroke-width=".9" fill="none"/>
  <path d="M42 55 C41 60 40 64 38 68 L41 69 C43 65 44 60 45 56 Z" fill="#c8573a" stroke="#eadbb8" stroke-width=".8"/>
  <path d="M39 68 l-.5 3 M40.5 69 l-.2 3" stroke-width=".8" fill="none"/>
  <!-- bras qui tient le fusil -->
  <path d="M56 30 C61 33 64 37 66 41 C67 44 66 46 64 46 L61 44 C61 40 59 36 55 34 Z"/>
  <path d="M62 44 C64 38 66 32 66 27 L69 26 C70 31 68 39 66 45 Z"/>
  <circle cx="67.5" cy="25.5" r="2.4"/>
  <!-- cou, tête et barbe -->
  <path d="M51 26 L55 26 L55 22 L51 22 Z"/>
  <circle cx="54" cy="17" r="5.6"/>
  <path d="M55 20 C58 21 60 23 59 25 C56 25 53 24 52 22 Z"/>
  <!-- tuque à pompon tombant -->
  <path d="M48 15 C48 10 52 7 57 8 C60 9 61 12 60 14 Z" fill="#c8573a" stroke="#eadbb8" stroke-width=".8"/>
  <path d="M49 10 C46 7 42 6 39 8 C38 11 41 13 44 13 Z" fill="#c8573a" stroke="#eadbb8" stroke-width=".8"/>
  <circle cx="38.5" cy="9" r="2.2"/>
  <path d="M47.5 14 C51 15.5 56 15.5 60.5 14 L60.5 16 C56 17.5 51 17.5 47.5 16 Z" fill="#3b3328" stroke="#eadbb8" stroke-width=".7"/>
  <!-- corne à poudre en bandoulière -->
  <path d="M44 31 C48 38 54 44 60 47" stroke-width="1.2" fill="none"/>
  <path d="M42 44 C44 47 48 48 50 46 L46 41 Z"/>
  <!-- sol -->
  <path d="M18 96 L82 96" stroke-width="1" fill="none" opacity=".6"/>
</g>
</svg>
