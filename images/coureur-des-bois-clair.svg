<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 4 68 94" width="272" height="376">
<title>Coureur des bois en marche : tuque, capot, ceinture fléchée, fusil et ballot de fourrures, à la manière d'une gravure</title>
<g fill="#eadbb8" stroke="#eadbb8" stroke-linejoin="round" stroke-linecap="round">
  <!-- ballot de fourrures sur le dos, retenu par le collier de portage -->
  <path d="M27 30 C24 31 22 35 22 40 L23 55 C24 58 28 59 32 58 L38 56 L39 32 C36 29 31 29 27 30 Z"/>
